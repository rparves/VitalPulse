name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04   # image ships with the Android SDK preinstalled
    timeout-minutes: 30
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Permanent signing key (repository secrets) so every new APK installs as an update.
      - name: Prepare signing key
        env:
          KS: ${{ secrets.VP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No VP_KEYSTORE_BASE64 secret — signing with a temporary debug key (updates will need a reinstall)."
          fi

      - name: Build release APKs
        env:
          VP_KEYSTORE_PASSWORD: ${{ secrets.VP_KEYSTORE_PASSWORD }}
          VP_KEY_ALIAS: ${{ secrets.VP_KEY_ALIAS }}
          VP_KEY_PASSWORD: ${{ secrets.VP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          { grep -E "^e: " build.log | sed 's#file:///home/runner/work/VitalPulse/VitalPulse/app/src/main/java/com/vitapulse/app/##' | sort -u; grep -A6 "What went wrong" build.log | head -30; } > errs.txt || true
          split -l 10 errs.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=build::${msg}"
          done

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*arm64-v8a*.apk dist/VitaPulse.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk dist/VitaPulse-armv7.apk
          ls -la dist
          echo "SIZE_MB=$(du -m dist/VitaPulse.apk | cut -f1)" >> "$GITHUB_ENV"
          echo "VERSION=1.1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VitaPulse ${{ env.VERSION }}
          make_latest: true
          files: |
            dist/VitaPulse.apk
            dist/VitaPulse-armv7.apk
          body: |
            ## Install on your phone
            Download: https://github.com/${{ github.repository }}/releases/latest/download/VitaPulse.apk

            Open that link on an Android 14+ phone, tap the downloaded file and choose Install.
            (Very old 32-bit phones: use VitaPulse-armv7.apk below.)

            Size: ~${{ env.SIZE_MB }} MB · Commit: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: VitaPulse-APKs
          path: dist/*.apk

      # Optional: email the install link. Needs secrets MAIL_USERNAME (Gmail address),
      # MAIL_PASSWORD (Gmail app password) and MAIL_TO (recipient).
      - name: Email install link
        if: env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: VitaPulse Builds <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "VitaPulse ${{ env.VERSION }} is ready to install"
          body: |
            A new VitaPulse build is ready (~${{ env.SIZE_MB }} MB).

            Install on your Android phone:
            https://github.com/${{ github.repository }}/releases/latest/download/VitaPulse.apk

            Release notes: https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}

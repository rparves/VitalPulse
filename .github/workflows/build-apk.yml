name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add these repository secrets to sign the release APK with your own key.
      # VP_KEYSTORE_BASE64, VP_KEYSTORE_PASSWORD, VP_KEY_ALIAS, VP_KEY_PASSWORD
      - name: Prepare signing key
        env:
          KS: ${{ secrets.VP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs
        env:
          VP_KEYSTORE_PASSWORD: ${{ secrets.VP_KEYSTORE_PASSWORD }}
          VP_KEY_ALIAS: ${{ secrets.VP_KEY_ALIAS }}
          VP_KEY_PASSWORD: ${{ secrets.VP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VitaPulse-APKs
          path: app/build/outputs/apk/**/*.apk
